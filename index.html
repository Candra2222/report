<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Realtime Conversion Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --bg: #0b0f19;
    --panel: #10162a;
    --border: #1f2740;
    --green: #2dd4a7;
    --text: #e6e9f2;
    --muted: #8b93a8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  /* SIDEBAR KIRI */
  aside {
    width: 240px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 16px;
    overflow-y: auto;
    transition: transform 0.3s ease;
    z-index: 100;
  }

  .brand-area { display: flex; justify-content: space-between; align-items: center; }
  .brand-area h2 { font-size: 13px; margin: 0; color: var(--text); letter-spacing: .5px; }
  .brand-area span { font-size: 11px; color: var(--muted); }
  
  .close-sidebar {
    background: transparent; border: none; color: var(--muted); font-size: 18px; cursor: pointer; display: none;
  }

  .menu-list { display: flex; flex-direction: column; gap: 4px; }
  .menu-btn {
    background: transparent; border: none; color: var(--muted); padding: 10px 12px;
    border-radius: 6px; font-size: 12px; text-align: left; cursor: pointer; display: flex; align-items: center; gap: 8px;
  }
  .menu-btn:hover, .menu-btn.active { background: rgba(45,212,167,.1); color: var(--green); font-weight: 600; }

  /* KONTEN UTAMA KANAN */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; width: 100%; }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--panel);
    gap: 10px; flex-wrap: wrap;
  }
  header .title-area { display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 13px; margin: 0; }
  
  .menu-toggle {
    background: transparent; border: 1px solid var(--border); color: var(--text);
    padding: 4px 8px; border-radius: 6px; font-size: 14px; cursor: pointer; display: none;
  }

  .header-right { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .clock { font-size: 11px; color: var(--muted); display: none; }
  .total-badge { font-size: 12px; color: var(--muted); }
  .total-badge b { color: var(--green); }
  .live-pill { background: rgba(45,212,167,.15); color: var(--green); font-size: 10px; padding: 2px 8px; border-radius: 999px; }
  
  .logout-btn {
    background: transparent; border: 1px solid var(--border); color: var(--muted);
    padding: 4px 8px; border-radius: 6px; font-size: 11px; cursor: pointer;
  }
  .logout-btn:hover { border-color: var(--green); color: var(--green); }

  /* TOOLBAR & FILTER */
  .toolbar { padding: 10px 16px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--border); background: rgba(16,22,42,0.4); flex-wrap: wrap; }
  .search-input {
    flex: 1; min-width: 160px; background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 7px 10px; border-radius: 6px; font-size: 12px; outline: none;
  }
  .search-input:focus { border-color: var(--green); }

  .filter-group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; width: 100%; }
  .network-select, .date-input {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 6px; font-size: 11px; outline: none; cursor: pointer; flex: 1;
  }
  .network-select:focus, .date-input:focus { border-color: var(--green); }

  /* TABEL DATA */
  .table-container { flex: 1; overflow-y: auto; overflow-x: auto; padding: 0 16px 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; min-width: 600px; }
  thead th {
    text-align: left; color: var(--muted); font-weight: 500; font-size: 10px;
    text-transform: uppercase; padding: 10px 12px; border-bottom: 1px solid var(--border);
    background: var(--bg); position: sticky; top: 0; z-index: 10;
  }
  tbody td { padding: 10px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  tbody tr.new-row { animation: flash 1.2s ease; }
  @keyframes flash { from { background: rgba(45,212,167,.25); } to { background: transparent; } }

  .payout { color: var(--green); font-weight: 600; }
  
  .table-footer-total {
    font-weight: bold; background: rgba(16,22,42,0.6); border-top: 2px solid var(--border);
  }

  #toast-container { position: fixed; bottom: 16px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 50; max-width: 90%; }
  .toast {
    background: var(--panel); border: 1px solid var(--green); border-radius: 8px;
    padding: 8px 12px; font-size: 11px; min-width: 200px; animation: slidein .3s ease;
  }
  @keyframes slidein { from { transform: translateX(30px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  /* RESPONSIF MEDIA QUERIES UNTUK HP */
  @media (max-width: 768px) {
    aside {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      transform: translateX(-100%);
    }
    aside.open {
      transform: translateX(0);
    }
    .close-sidebar {
      display: block;
    }
    .menu-toggle {
      display: inline-block;
    }
    .clock {
      display: none;
    }
    .filter-group {
      justify-content: space-between;
    }
    .toolbar {
      flex-direction: column;
      align-items: stretch;
    }
    .search-input {
      width: 100%;
    }
  }

  @media (min-width: 769px) {
    .clock {
      display: block;
    }
    .filter-group {
      width: auto;
    }
    .network-select, .date-input {
      flex: unset;
    }
  }
</style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="brand-area">
      <div>
        <h2>REALTIME</h2>
        <span>Conversion Monitor</span>
      </div>
      <button class="close-sidebar" onclick="toggleSidebar()">✕</button>
    </div>

    <div class="menu-list" id="sidebar-nav">
      <button class="menu-btn active" data-page="today">⚡ Today</button>
      <button class="menu-btn" data-page="yesterday">🕒 Yesterday</button>
      <button class="menu-btn" data-page="reports">📊 Reports</button>
    </div>
  </aside>

  <!-- KONTEN UTAMA -->
  <div class="main-content">
    <header>
      <div class="title-area">
        <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
        <h1 id="page-title">REALTIME CONVERSION</h1>
      </div>
      <div class="header-right">
        <div class="clock" id="clock">00:00:00 AM</div>
        <div class="total-badge">Total: <b id="total-payout">$0.00</b></div>
        <div class="live-pill">● LIVE</div>
        <button class="logout-btn" onclick="logout()">Logout</button>
      </div>
    </header>

    <div class="toolbar">
      <input type="text" id="search-input" class="search-input" placeholder="Search Click ID, Country, IP..." onkeyup="applyFilters()" />
      
      <div class="filter-group">
        <select id="network-filter" class="network-select" onchange="applyFilters()">
          <option value="all">All Networks</option>
          <option value="trafee">Trafee</option>
          <option value="imonetizeit">iMonetizeIt</option>
        </select>

        <input type="date" id="date-start" class="date-input" onchange="applyFilters()" />
        <span style="font-size:11px; color:var(--muted);">s/d</span>
        <input type="date" id="date-end" class="date-input" onchange="applyFilters()" />
      </div>
    </div>

    <div class="table-container">
      <table>
        <thead id="table-head"></thead>
        <tbody id="conversion-rows"></tbody>
      </table>
    </div>
  </div>

  <div id="toast-container"></div>

<script>
  const SUPABASE_URL = "https://lgbebnyzlgawauvyfjub.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxnYmVibnl6bGdhd2F1dnlmanViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5NTA1ODAsImV4cCI6MjEwMTUyNjU4MH0.lZpf5XyC1GGxreTOpEYvk1gdZBIJI0XiFUWXMRbKjW0";

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allConversions = [];
  let currentPage = "today";

  const todayIso = new Date().toISOString().split('T')[0];
  document.getElementById("date-start").value = todayIso;
  document.getElementById("date-end").value = todayIso;

  setInterval(() => {
    document.getElementById("clock").textContent = new Date().toLocaleTimeString();
  }, 1000);

  function toggleSidebar() {
    const sidebar = document.getElementById("sidebar");
    sidebar.classList.toggle("open");
  }

  async function logout() {
    await fetch("/api/logout", { method: "POST" });
    window.location.href = "/login.html";
  }

  function fmtMoney(n) { return "$" + Number(n).toFixed(2); }

  function countryToFlag(countryCode) {
    if (!countryCode) return "🌐";
    const cleanCode = countryCode.trim().split(/\s+/)[0].toLowerCase();
    if (cleanCode.length !== 2) return countryCode;
    return `<img src="https://flagcdn.com/w40/${cleanCode}.png" alt="${cleanCode}" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover; vertical-align: middle;" />`;
  }

  function networkToLogo(networkName) {
    if (!networkName) return "-";
    const net = networkName.trim().toLowerCase();

    let logoUrl = "";
    if (net === "trafee") {
      logoUrl = "/assets/trafee.png";
    } else if (net === "imonetizeit") {
      logoUrl = "/assets/imo.png";
    } else {
      return networkName.toUpperCase();
    }

    return `<img src="${logoUrl}" alt="${net}" style="height: 20px; object-fit: contain; vertical-align: middle;" />`;
  }
  
  function renderView(data) {
    const thead = document.getElementById("table-head");
    const tbody = document.getElementById("conversion-rows");
    tbody.innerHTML = "";

    if (currentPage === "reports") {
      thead.innerHTML = `
        <tr>
          <th>#</th>
          <th>Click ID</th>
          <th>Network</th>
          <th>Conversions</th>
          <th>Payouts</th>
        </tr>
      `;

      const grouped = {};
      data.forEach(row => {
        const id = row.click_id || "UNKNOWN";
        if (!grouped[id]) {
          grouped[id] = { click_id: id, network: row.network, count: 0, payout: 0 };
        }
        grouped[id].count += 1;
        grouped[id].payout += Number(row.payout || 0);
      });

      const groupedArray = Object.values(grouped).sort((a, b) => b.payout - a.payout);
      let totalSum = 0;
      let totalCount = 0;

      groupedArray.forEach((item, index) => {
        totalSum += item.payout;
        totalCount += item.count;
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td><b>${item.click_id}</b></td>
          <td>${networkToLogo(item.network)}</td>
          <td>${item.count}</td>
          <td class="payout">${fmtMoney(item.payout)}</td>
        `;
        tbody.appendChild(tr);
      });

      if (groupedArray.length > 0) {
        const trTotal = document.createElement("tr");
        trTotal.className = "table-footer-total";
        trTotal.innerHTML = `
          <td>TOTAL</td>
          <td>-</td>
          <td>-</td>
          <td>${totalCount}</td>
          <td class="payout">${fmtMoney(totalSum)}</td>
        `;
        tbody.appendChild(trTotal);
      }

      document.getElementById("total-payout").textContent = fmtMoney(totalSum);

    } else {
      thead.innerHTML = `
        <tr>
          <th>#</th>
          <th>Network</th>
          <th>Click ID</th>
          <th>Country</th>
          <th>Payout</th>
          <th>IP</th>
          <th>Time</th>
        </tr>
      `;

      let totalSum = 0;
      data.forEach((row, index) => {
        totalSum += Number(row.payout || 0);
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td>${index + 1}</td>
          <td>${networkToLogo(row.network)}</td>
          <td>${row.click_id ?? "-"}</td>
          <td>${countryToFlag(row.country)}</td>
          <td class="payout">${fmtMoney(row.payout)}</td>
          <td>${row.ip ?? "-"}</td>
          <td>${new Date(row.created_at).toLocaleTimeString()}</td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById("total-payout").textContent = fmtMoney(totalSum);
    }
  }

  function applyFilters() {
    const keyword = document.getElementById("search-input").value.toLowerCase();
    const selectedNetwork = document.getElementById("network-filter").value;
    const dateStartVal = document.getElementById("date-start").value;
    const dateEndVal = document.getElementById("date-end").value;

    const filtered = allConversions.filter(row => {
      const rowDateObj = new Date(row.created_at);
      const rowDateStr = rowDateObj.toISOString().split('T')[0];

      const nowStr = new Date().toISOString().split('T')[0];
      const yestObj = new Date();
      yestObj.setDate(yestObj.getDate() - 1);
      const yestStr = yestObj.toISOString().split('T')[0];

      if (currentPage === "today" && rowDateStr !== nowStr) return false;
      if (currentPage === "yesterday" && rowDateStr !== yestStr) return false;

      if (dateStartVal && rowDateStr < dateStartVal) return false;
      if (dateEndVal && rowDateStr > dateEndVal) return false;

      if (selectedNetwork !== "all" && row.network !== selectedNetwork) return false;

      if (keyword) {
        const matchId = row.click_id && row.click_id.toLowerCase().includes(keyword);
        const matchCountry = row.country && row.country.toLowerCase().includes(keyword);
        const matchIp = row.ip && row.ip.toLowerCase().includes(keyword);
        if (!matchId && !matchCountry && !matchIp) return false;
      }

      return true;
    });

    renderView(filtered);
  }

  function showToast(row) {
    const container = document.getElementById("toast-container");
    const div = document.createElement("div");
    div.className = "toast";
    div.innerHTML = `<b>${row.network.toUpperCase()}</b> — ${row.click_id} <span class="payout">${fmtMoney(row.payout)}</span>`;
    container.appendChild(div);
    setTimeout(() => div.remove(), 4000);
  }

  document.querySelectorAll("#sidebar-nav button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#sidebar-nav button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      
      currentPage = btn.dataset.page;
      document.getElementById("page-title").textContent = currentPage.toUpperCase() + " CONVERSION";
      applyFilters();

      // Tutup sidebar otomatis di HP setelah memilih menu
      if (window.innerWidth <= 768) {
        toggleSidebar();
      }
    });
  });

  async function loadInitial() {
    const { data, error } = await supabaseClient
      .from("conversions")
      .select("*")
      .order("created_at", { ascending: false })
      .limit(1000);

    if (error) { console.error(error); return; }
    allConversions = data || [];
    applyFilters();
  }

  function subscribeRealtime() {
    supabaseClient
      .channel("conversions-realtime")
      .on(
        "postgres_changes",
        { event: "INSERT", schema: "public", table: "conversions" },
        (payload) => {
          allConversions.unshift(payload.new);
          applyFilters();
          showToast(payload.new);
        }
      )
      .subscribe();
  }

  loadInitial();
  subscribeRealtime();
</script>
</body>
</html>
